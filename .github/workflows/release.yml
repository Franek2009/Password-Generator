name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  android:
    name: Android
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  packages:
    name: Packages
    uses: ./.github/workflows/package.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    name: Publish release
    needs:
      - tests
      - packages
      - android
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-x86_64.tar.gz
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-windows-x86_64.zip
          path: release-assets
          skip-decompress: true

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-android.apk
          path: release-assets

      - name: Download Linux license audit
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-license-audit
          path: release-audit

      - name: Download and verify corresponding source
        run: |
          python scripts/prepare_release_sources.py \
            --audit-source-packages release-audit/source-packages.tsv \
            --output release-sources \
            --release-tag "$GITHUB_REF_NAME"

      - name: Package verified dependency sources
        run: |
          python scripts/source_archive.py --sources release-sources \
            --output release-assets/PasswordGenerator-third-party-sources.tar.gz

      - name: Validate release assets
        run: |
          required_assets=(
            release-assets/PasswordGenerator-linux-x86_64.tar.gz
            release-assets/PasswordGenerator-windows-x86_64.zip
            release-assets/PasswordGenerator-android.apk
            release-assets/PasswordGenerator-third-party-sources.tar.gz
          )

          for asset in "${required_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Required release asset is missing: $asset"
              echo "Files present in release-assets and release-sources:"
              find release-assets release-sources -type f -print | sort
              exit 1
            fi
          done

          expected_source_count=53
          source_count=$(find release-sources/qt release-sources/ubuntu \
            -type f | wc -l)
          echo "Corresponding Source files: actual=$source_count expected=$expected_source_count"
          if [ "$source_count" -ne "$expected_source_count" ]; then
            find release-sources/qt release-sources/ubuntu \
              -type f -print | sort
            exit 1
          fi

          oversized=$(find release-assets release-sources -type f \
            -size +2147483647c -print -quit)
          if [ -n "$oversized" ]; then
            echo "Release asset exceeds the per-file limit: $oversized"
            stat --format='size=%s bytes' "$oversized"
            exit 1
          fi

          echo "No release asset is 2 GiB or larger"

      - name: Validate packaged application versions
        run: |
          expected_version=$(python -m app.versioning from-tag "$GITHUB_REF_NAME")
          linux_version=$(tar -xOf \
            release-assets/PasswordGenerator-linux-x86_64.tar.gz \
            PasswordGenerator/_internal/app/VERSION)
          windows_version=$(python - \
            release-assets/PasswordGenerator-windows-x86_64.zip <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              version = archive.read(
                  "PasswordGenerator/_internal/app/VERSION"
              ).decode("utf-8").strip()
          print(version)
          PY
          )

          echo "Release tag: $GITHUB_REF_NAME"
          echo "Expected application version: $expected_version"
          echo "Linux application version: $linux_version"
          echo "Windows application version: $windows_version"

          python -m app.versioning check \
            "$GITHUB_REF_NAME" "$linux_version" --artifact Linux
          python -m app.versioning check \
            "$GITHUB_REF_NAME" "$windows_version" --artifact Windows

      - name: Prepare release notes
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          entries = [
              ("Android APK (Android 8.0+)", "PasswordGenerator-android.apk"),
              ("Windows x86-64", "PasswordGenerator-windows-x86_64.zip"),
              ("Linux x86-64", "PasswordGenerator-linux-x86_64.tar.gz"),
          ]
          text = "## Download\n\n" + "\n".join(f"- [{label}]({base}/{name})" for label, name in entries)
          text += f"\n\n## Third-party sources\n\n[Complete sources and checksum manifest]({base}/PasswordGenerator-third-party-sources.tar.gz). Not required to run the application.\n"
          Path("release-notes.md").write_text(text, encoding="utf-8")
          PYTHON

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 1
            fi

            echo "Reusing existing draft release $GITHUB_REF_NAME"
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(
            find release-assets \
              -type f -print0 | sort -z
          )

          gh release upload "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=false
