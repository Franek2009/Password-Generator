name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  packages:
    name: Packages
    uses: ./.github/workflows/package.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    name: Publish release
    needs:
      - tests
      - packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-x86_64.tar.gz
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-windows-x86_64.zip
          path: release-assets
          skip-decompress: true

      - name: Download Linux license audit
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-license-audit
          path: release-audit

      - name: Download and verify corresponding source
        run: |
          python scripts/prepare_release_sources.py \
            --audit-source-packages release-audit/source-packages.tsv \
            --output release-sources

      - name: Validate release assets
        run: |
          required_assets=(
            release-assets/PasswordGenerator-linux-x86_64.tar.gz
            release-assets/PasswordGenerator-windows-x86_64.zip
            release-sources/SOURCE_ASSETS_MANIFEST.txt
          )

          for asset in "${required_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Required release asset is missing: $asset"
              echo "Files present in release-assets and release-sources:"
              find release-assets release-sources -type f -print | sort
              exit 1
            fi
          done

          expected_source_count=53
          source_count=$(find release-sources/qt release-sources/ubuntu \
            -type f | wc -l)
          echo "Corresponding Source files: actual=$source_count expected=$expected_source_count"
          if [ "$source_count" -ne "$expected_source_count" ]; then
            find release-sources/qt release-sources/ubuntu \
              -type f -print | sort
            exit 1
          fi

          oversized=$(find release-assets release-sources -type f \
            -size +2147483647c -print -quit)
          if [ -n "$oversized" ]; then
            echo "Release asset exceeds the per-file limit: $oversized"
            stat --format='size=%s bytes' "$oversized"
            exit 1
          fi

          echo "No release asset is 2 GiB or larger"

      - name: Validate packaged application versions
        run: |
          expected_version=$(python -m app.versioning from-tag "$GITHUB_REF_NAME")
          linux_version=$(tar -xOf \
            release-assets/PasswordGenerator-linux-x86_64.tar.gz \
            PasswordGenerator/_internal/app/VERSION)
          windows_version=$(python - \
            release-assets/PasswordGenerator-windows-x86_64.zip <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              version = archive.read(
                  "PasswordGenerator/_internal/app/VERSION"
              ).decode("utf-8").strip()
          print(version)
          PY
          )

          echo "Release tag: $GITHUB_REF_NAME"
          echo "Expected application version: $expected_version"
          echo "Linux application version: $linux_version"
          echo "Windows application version: $windows_version"

          python -m app.versioning check \
            "$GITHUB_REF_NAME" "$linux_version" --artifact Linux
          python -m app.versioning check \
            "$GITHUB_REF_NAME" "$windows_version" --artifact Windows

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 1
            fi

            echo "Reusing existing draft release $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(
            find release-assets release-sources \
              -type f -print0 | sort -z
          )

          gh release upload "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=false
