name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  packages:
    name: Packages
    uses: ./.github/workflows/package.yml

  release:
    name: Publish release
    needs:
      - tests
      - packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-x86_64.tar.gz
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-windows-x86_64.zip
          path: release-assets

      - name: Download Linux license audit
        uses: actions/download-artifact@v8
        with:
          name: PasswordGenerator-linux-license-audit
          path: release-audit

      - name: Download and verify corresponding source
        run: |
          python scripts/prepare_release_sources.py \
            --audit-source-packages release-audit/source-packages.tsv \
            --output release-sources

      - name: Validate release assets
        run: |
          test -f release-assets/PasswordGenerator-linux-x86_64.tar.gz
          test -f release-assets/PasswordGenerator-windows-x86_64.zip
          test -f release-sources/SOURCE_ASSETS_MANIFEST.txt

          source_count=$(find release-sources/qt release-sources/ubuntu \
            -type f | wc -l)
          test "$source_count" -eq 53

          oversized=$(find release-assets release-sources -type f \
            -size +2147483647c -print -quit)
          test -z "$oversized"

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published"
              exit 1
            fi

            echo "Reusing existing draft release $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(
            find release-assets release-sources \
              -type f -print0 | sort -z
          )

          gh release upload "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=false
